<svg xmlns="http://www.w3.org/2000/svg" viewBox="276 209.9 472 604.2" role="img" aria-label="LumiThemes">
	<!-- The bare monogram from logo.svg, cropped to the glyph: for the page,
	     where the ground is already dark and a tile would only add an edge.
	     White on transparent, so it vanishes on a light ground by design. -->
