		<rect x="276" y="209.9" width="141.6" height="604.2"/>
		<rect x="276" y="672.5" width="472" height="141.6"/>
	</g>
	<clipPath id="sun"><circle cx="644.2" cy="445.9" r="103.8"/></clipPath>
	<g clip-path="url(#sun)" fill="#000000">
		<rect x="540.3" y="342.1" width="207.7" height="95.5"/>
		<rect x="540.3" y="445.1" width="207.7" height="31.1"/>
		<rect x="540.3" y="491.1" width="207.7" height="22.4"/>
		<rect x="540.3" y="536" width="207.7" height="13.8"/>
	</g>
</svg>
